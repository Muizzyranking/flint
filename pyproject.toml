[project]
name = "flint"
version = "0.1.0"
description = "Quietly igniting your payload, every job has a spark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "gunicorn>=26.0.0",
    "httpx2>=2.3.0",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "sqlalchemy[asyncio]>=2.0.50",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [ "E", "F", "I", "B", "UP" ]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.3.0",
    "ruff>=0.15.16",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "uvicorn app.main:app --reload "
migrate = "alembic upgrade head"
test = "pytest tests/"
lint = "ruff check ."
format = "ruff format ."

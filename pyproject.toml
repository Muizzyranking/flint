[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[project]
name = "flint"
version = "0.2.0"
description = "Distributed, Postgres-backed job scheduling service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "email-validator>=2.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.14.1",
    "redis>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
flint = "app.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [ "E", "F", "I", "B", "UP" ]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.16",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "flint api --reload"
worker = "flint worker"
migrate = "flint migrate"
test = "pytest tests/"
lint = "ruff check ."
format = "ruff format ."
